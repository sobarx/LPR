<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Pública - Publicaciones</title>
<style>
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 20px; 
    background-color: #f5eada; 
    color: #56561F; 
    letter-spacing: 0.03em; 
}

.encabezado {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 30px auto;
}

h1 { color: #797921; margin-bottom: 5px; }

/* Contenedores generales */
.seccion-bloque {
    max-width: 800px;
    margin: 0 auto 25px auto;
    width: 92%;
}

/* 1. Post más reciente */
.tarjeta-post { 
    background-color: #f5eada; 
    padding: 20px; 
    border-radius: 15px; 
    box-shadow: 0px 6px 6px rgba(0, 0, 0, 0.2); 
    border-top: 6px solid #797921; 
    box-sizing: border-box;
}

.tarjeta-post h2 { 
    color: #797921; 
    margin-top: 0; 
}

.img-miniatura {
    width: 100%;
    height: auto;
    border-radius: 10px;
    margin: 12px 0 5px 0;
    display: block;
}

.fecha { 
    font-size: 0.85em; 
    color: #797921; 
    font-weight: bold; 
}

.btn-leer { 
    display: inline-block; 
    margin-top: 10px; 
    padding: 8px 16px; 
    background-color: #797921; 
    color: #f5eada; 
    text-decoration: none; 
    border-radius: 6px; 
    font-weight: bold; 
}

.btn-leer:hover { 
    background-color: #56561F; 
}

/* 2. Lista de enlaces (Top 10 siguientes) */
.lista-titulos {
    list-style-type: none;
    padding: 0;
    margin: 20px 0;
}

.lista-titulos li {
    padding: 10px 14px;
    border-bottom: 1px dashed #797921;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.lista-titulos a {
    color: #797921;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.2s;
}

.lista-titulos a:hover {
    color: #56561F;
    text-decoration: underline;
}

/* 3. Acordeón para el resto de post */
details {
    background-color: rgba(121, 121, 33, 0.08);
    border-radius: 10px;
    padding: 12px 18px;
    border: 1px solid #797921;
}

summary {
    font-weight: bold;
    color: #797921;
    cursor: pointer;
    font-size: 1.05em;
    outline: none;
}

summary:hover {
    color: #56561F;
}

.mensaje-error {
    text-align: center;
    color: #a94442;
    background-color: #f2dede;
    padding: 15px;
    border-radius: 8px;
    max-width: 600px;
    margin: 20px auto;
}
</style>
</head>
<body>

<div class="encabezado">
    <h1>Bitácora Pública</h1>
    <p>Noticias - Actualidad - Opinión</p>
</div>

<div id="contenedor-publicaciones"></div>

<script>
fetch('./posts.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('No se pudo encontrar el archivo posts.json (Código: ' + response.status + ')');
    }
    return response.json();
  })
  .then(posts => {
    const contenedor = document.getElementById('contenedor-publicaciones');
    
    if (!posts || posts.length === 0) {
      contenedor.innerHTML = '<p style="text-align:center;">No hay publicaciones disponibles.</p>';
      return;
    }

    // Invertimos el arreglo para tener los más recientes primero
    const postsOrdenados = posts.slice().reverse();

    // 1. Post más reciente
    const reciente = postsOrdenados[0];
    const miniaturaHtml = reciente.imagen 
      ? `<img src="${reciente.imagen}" alt="${reciente.titulo}" class="img-miniatura">` 
      : '';

    let htmlContenido = `
      <div class="seccion-bloque tarjeta-post">
        <h2>${reciente.titulo}</h2>
        <span class="fecha">📅 ${reciente.fecha}</span>
        ${miniaturaHtml}
        <p>${reciente.resumen}</p>
        <a class="btn-leer" href="${reciente.archivo}">Leer publicación completa →</a>
      </div>
    `;

    // 2. Los siguientes 10 posts (del índice 1 al 10)
    const siguientesDiez = postsOrdenados.slice(1, 11);
    if (siguientesDiez.length > 0) {
      htmlContenido += `<div class="seccion-bloque"><ul class="lista-titulos">`;
      siguientesDiez.forEach(post => {
        htmlContenido += `
          <li>
            <a href="${post.archivo}">${post.titulo}</a>
            <span class="fecha">${post.fecha}</span>
          </li>
        `;
      });
      htmlContenido += `</ul></div>`;
    }

    // 3. El resto de posts (del índice 11 en adelante) dentro del acordeón
    const restoPosts = postsOrdenados.slice(11);
    if (restoPosts.length > 0) {
      htmlContenido += `
        <div class="seccion-bloque">
          <details>
            <summary>📦 Ver publicaciones anteriores (${restoPosts.length})</summary>
            <ul class="lista-titulos">
      `;
      restoPosts.forEach(post => {
        htmlContenido += `
          <li>
            <a href="${post.archivo}">${post.titulo}</a>
            <span class="fecha">${post.fecha}</span>
          </li>
        `;
      });
      htmlContenido += `
            </ul>
          </details>
        </div>
      `;
    }

    contenedor.innerHTML = htmlContenido;
  })
  .catch(error => {
    console.error('Error al cargar publicaciones:', error);
    document.getElementById('contenedor-publicaciones').innerHTML = 
      `<div class="mensaje-error"><strong>Atención:</strong> ${error.message}</div>`;
  });
</script>

</body>
</html>
