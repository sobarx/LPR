<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Pública - Publicaciones</title>
<style>
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 20px; 
    background-color: #f5eada; 
    color: #56561F; 
    letter-spacing: 0.03em; 
}

.encabezado {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 30px auto;
}

h1 { color: #797921; margin-bottom: 5px; }


.tarjeta-post { 
    background-color: #f5eada; 
    max-width: 800px; 
    padding: 20px; 
    border-radius: 15px; 
    box-shadow: 0px 6px 6px rgba(0, 0, 0, 0.2); 
    margin: 0 auto 25px auto; 
    width: 92%; 
    border-top: 6px solid #797921; 
    box-sizing: border-box;
}

.tarjeta-post h2 { 
    color: #797921; 
    margin-top: 0; 
}


.img-miniatura {
    width: 100%;
    height: auto;
    border-radius: 10px;
    margin: 12px 0 5px 0;
    display: block;
}

.fecha { 
    font-size: 0.85em; 
    color: #797921; 
    font-weight: bold; 
}

.btn-leer { 
    display: inline-block; 
    margin-top: 10px; 
    padding: 8px 16px; 
    background-color: #797921; 
    color: #f5eada; 
    text-decoration: none; 
    border-radius: 6px; 
    font-weight: bold; 
}

.btn-leer:hover { 
    background-color: #56561F; 
}

.mensaje-error {
    text-align: center;
    color: #a94442;
    background-color: #f2dede;
    padding: 15px;
    border-radius: 8px;
    max-width: 600px;
    margin: 20px auto;
}
</style>
</head>
<body>

<div class="encabezado">
    <h1>Bitácora Pública</h1>
    <p>Noticias - Actualidad - Opinión</p>
</div>


<div id="contenedor-publicaciones"></div>

<script>

fetch('./posts.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('No se pudo encontrar el archivo posts.json (Código: ' + response.status + ')');
    }
    return response.json();
  })
  .then(posts => {
    const contenedor = document.getElementById('contenedor-publicaciones');
    
    if (!posts || posts.length === 0) {
      contenedor.innerHTML = '<p style="text-align:center;">No hay publicaciones disponibles.</p>';
      return;
    }

    posts.slice().reverse().forEach(post => {
      const tarjeta = document.createElement('div');
      tarjeta.className = 'tarjeta-post';
      
      
      const miniaturaHtml = post.imagen 
        ? `<img src="${post.imagen}" alt="${post.titulo}" class="img-miniatura">` 
        : '';

      tarjeta.innerHTML = `
        <h2>${post.titulo}</h2>
        <span class="fecha">📅 ${post.fecha}</span>
        ${miniaturaHtml}
        <p>${post.resumen}</p>
        <a class="btn-leer" href="${post.archivo}">Leer publicación completa →</a>
      `;
      
      contenedor.appendChild(tarjeta);
    });
  })
  .catch(error => {
    console.error('Error al cargar publicaciones:', error);
    document.getElementById('contenedor-publicaciones').innerHTML = 
      `<div class="mensaje-error"><strong>Atención:</strong> ${error.message}</div>`;
  });
</script>

</body>
</html>
