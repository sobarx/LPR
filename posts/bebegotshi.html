<input id="input" type="text" style="width:50%">
<button onclick="preguntar()">Preguntar</button>
<h2>Respuesta</h2>
<div id="log"></div>  

<div>
<p>
<br>
<br>
<br>
<br>
</p>
</div>

<h2>Enseñar hablar al bebé</h2>
<button onclick="insertarPregunta()">Insertar pregunta</button>
<button onclick="insertarRespuesta()">Insertar respuesta</button>

<div class="seccion-con-imagen">
<img src="https://raw.githubusercontent.com/sobarx/LPR/refs/heads/main/imagenes/bebegotshi.jpg" alt="Bloc interactivo" style="max-width: 100%; height: auto; border-radius: 10px;">
</div>


<script>
(() => {
  const tiempoLimite = 7000000;

  let memoria = JSON.parse(localStorage.getItem("memoria")) || [];
  let ultimaPregunta = "";
  let timerInactividad = null;

  function guardarMemoria() {
    localStorage.setItem("memoria", JSON.stringify(memoria));
  }

  function obtenerElemento(id) {
    const elemento = document.getElementById(id);

    if (!elemento) {
      console.error(`No se encontró el elemento con id="${id}"`);
    }

    return elemento;
  }

  function mostrarImg1() {
    const img1 = obtenerElemento("img1");
    const img2 = obtenerElemento("img2");

    if (!img1 || !img2) return;

    img1.style.display = "block";
    img2.style.display = "none";
  }

  function mostrarImg2() {
    const img1 = obtenerElemento("img1");
    const img2 = obtenerElemento("img2");

    if (!img1 || !img2) return;

    img1.style.display = "none";
    img2.style.display = "block";
  }

  function reiniciarTimer() {
    clearTimeout(timerInactividad);

    
    mostrarImg1();

    
    timerInactividad = setTimeout(mostrarImg2, tiempoLimite);
  }

  window.insertarPregunta = function () {
    const input = obtenerElemento("input");
    const log = obtenerElemento("log");

    if (!input || !log) return;

    const texto = input.value.trim().toLowerCase();

    if (!texto) return;

    ultimaPregunta = texto;

    log.insertAdjacentHTML(
      "beforeend",
      `<p><b>Pregunta guardada:</b> ${texto}</p>`
    );

    input.value = "";
  };

  window.insertarRespuesta = function () {
    const input = obtenerElemento("input");
    const log = obtenerElemento("log");

    if (!input || !log) return;

    const texto = input.value.trim();

    if (!texto || !ultimaPregunta) {
      alert("Primero debes insertar una pregunta antes de la respuesta.");
      return;
    }

    memoria.push({
      pregunta: ultimaPregunta,
      respuesta: texto
    });

    guardarMemoria();

    log.insertAdjacentHTML(
      "beforeend",
      `<p><b>Respuesta guardada:</b> ${texto}</p>`
    );

    ultimaPregunta = "";
    input.value = "";

    
    reiniciarTimer();
  };

  function similitud(a, b) {
    const palabrasA = a.split(/s+/);
    const palabrasB = b.split(/s+/);

    const comunes = palabrasA.filter(palabra =>
      palabrasB.includes(palabra)
    );

    return comunes.length / Math.max(palabrasA.length, palabrasB.length);
  }

  window.preguntar = function () {
    const input = obtenerElemento("input");
    const log = obtenerElemento("log");

    if (!input || !log) return;

    const pregunta = input.value.trim().toLowerCase();

    if (!pregunta) return;

    let mejor = null;
    let mejorScore = 0;

    memoria.forEach(item => {
      const score = similitud(pregunta, item.pregunta);

      if (score > mejorScore) {
        mejorScore = score;
        mejor = item;
      }
    });

    const respuesta = mejor ? mejor.respuesta : "No sé.";

    log.insertAdjacentHTML(
      "beforeend",
      `<p>
        <b>Pregunta:</b> ${pregunta}<br>
        <b>Respuesta:</b> ${respuesta}
      </p>`
    );

    input.value = "";

    
    reiniciarTimer();
  };

  function iniciar() {
    const img1 = obtenerElemento("img1");
    const img2 = obtenerElemento("img2");

    if (!img1 || !img2) return;

    
    reiniciarTimer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", iniciar);
  } else {
    iniciar();
  }
})();
</script>

</body>
