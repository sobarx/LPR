<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Sobarx Github</title>
<meta name="DC.title" content="Blog Sobarx Github">
<meta name="DC.creator" content="DJMP">

<style>
html { scroll-behavior: smooth; }
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 20px; 
    background-image: url("ENLACE_IMAGEN_FONDO"); 
    background-size: cover; 
    background-repeat: no-repeat; 
    background-attachment: fixed; 
    background-position: center; 
    background-color: #f5eada; 
    color: #56561F; 
    letter-spacing: 0.03em; 
}

.contenido, .container { 
    background-color: #f5eada; 
    max-width: 800px; 
    padding: 12px; 
    border-radius: 15px; 
    box-shadow: 0px 6px 6px rgba(0, 0, 0, 0.2); 
    margin: 0 auto 40px auto; 
    width: 92%; 
    overflow-wrap: break-word; 
    border-top: 6px solid #797921; 
}

.seccion-con-imagen { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 5px 20px 20px 20px; 
    background-color: #f5eada; 
    margin: 0 auto 40px auto; 
    max-width: 800px;
    width: 92%;
    border-radius: 10px; 
    box-shadow: 0px 6px 6px rgba(0, 0, 0, 0.2); 
    text-align: center; 
    border-top: 6px solid #797921; 
}

/* IMAGEN */
.seccion-con-imagen img { 
    max-width: 85%; 
    max-height: 400px; 
    height: auto; 
    display: block; 
    margin: 10px auto 0 auto; 
    border-radius: 6px; 
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3); 
    object-fit: contain; 
}

/* VIDEO E IFRAME */
.seccion-con-video iframe, .seccion-con-audio iframe {
    width: 90%;
    max-width: 700px;
    display: block;
    margin: 10px auto;
    border-radius: 8px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
}

h1 { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 2.1em; 
    margin-top: 15px; 
    margin-bottom: 10px; 
    color: #797921; 
    letter-spacing: 0.03em; 
    line-height: 1.1; 
    word-wrap: break-word; 
}

h2 { 
    text-align: center; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 1.75em; 
    margin-top: 15px; 
    color: #797921; 
    letter-spacing: 0.03em; 
    line-height: 1.1; 
    word-wrap: break-word; 
}

h3 { 
    text-align: left; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 1.0em; 
    margin-top: 15px; 
    color: #56561F; 
    letter-spacing: 0.03em; 
    line-height: 1.1; 
    word-wrap: break-word; 
}
</style>
</head>
<body>

<!-- 1. BLOQUE DE IMAGEN -->
<div class="seccion-con-imagen">
    <h1><strong>Mi primer post</strong></h1>
    <img src="https://lh3.googleusercontent.com/d/1q8tjxmUDNGE9x0LwH6MkPTT1TqgqmY4r" alt="Imagen del post">
</div>

<!-- 2. BLOQUE DE VIDEO -->
<div class="seccion-con-imagen seccion-con-video">
    <h3>Video de la publicación</h3>
    <iframe src="https://drive.google.com/file/d/1PRfBYkAZVCeL_Smdl_vmhgZxVoT0I9Z6/preview" height="360" style="border:0;" allow="autoplay"></iframe>
</div>

<!-- 3. BLOQUE DE AUDIO -->
<div class="seccion-con-imagen seccion-con-audio">
    <h3>Audio de la publicación</h3>
    <iframe src="https://drive.google.com/file/d/1g5Wm-syx2ZbPmM5ABOLa3EgGtmP8Hhl6/preview" height="100" style="border:0;" allow="autoplay"></iframe>
</div>

<!-- 4. DESARROLLO DEL POST -->
<div class="container">
    <p>Estoy ansioso de publicar mi primer post por githob, está quedando padre</p>
</div>   

</body>
</html>
