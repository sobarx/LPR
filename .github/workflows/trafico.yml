name: Reporte de Trafico LPR
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  reportar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar trafico y enviar a Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. Consultar la API oficial de GitHub Traffic
          TRAFFIC=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://github.com)
          
          # 2. Extraer datos del JSON usando jq
          VIEWS=$(echo "$TRAFFIC" | jq '.count // 0')
          UN_VIEWS=$(echo "$TRAFFIC" | jq '.uniques // 0')
          
          # 3. Mensaje en una sola línea usando \n para evitar que el editor se ponga rojo
          MESSAGE="📊 *REPORTE DE TRÁFICO: sobarx/LPR*\n\n🌐 *Visitas (Últimos 14 días):*\n• Totales: $VIEWS\n• Usuarios únicos: $UN_VIEWS"
          
          # 4. Enviar a la API correcta de Telegram usando la palabra 'bot' requerida
          curl -s -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=$(echo -e $MESSAGE)" \
            -d "parse_mode=Markdown"
            
